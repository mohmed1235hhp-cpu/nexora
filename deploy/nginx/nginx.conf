# Nginx front-line load balancer for the Cyber AI API.
# Drop this on any host in front of one or more `api` upstream instances.
# The application already emits X-Forwarded-* aware behavior — no code change.

worker_processes auto;
worker_rlimit_nofile 65535;
events { worker_connections 16384; use epoll; multi_accept on; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    server_tokens off;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;
    # If your nginx has brotli — mirror the same MIME list under brotli_types.

    # --- Logging (structured, JSON-friendly) ---
    log_format main escape=json '{'
        '"ts":"$time_iso8601",'
        '"ip":"$remote_addr","xff":"$http_x_forwarded_for",'
        '"method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"ua":"$http_user_agent",'
        '"req_id":"$request_id"'
    '}';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    # --- Rate limiting (edge) ---
    limit_req_zone  $binary_remote_addr zone=api_ip:20m       rate=50r/s;
    limit_req_zone  $binary_remote_addr zone=login_ip:10m     rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

    # --- Upstream API (horizontal scale) ---
    upstream cyberai_api {
        least_conn;
        keepalive 64;
        # Add or remove upstream servers to scale horizontally.
        server api:3000       max_fails=3 fail_timeout=10s;
        # server api-2:3000   max_fails=3 fail_timeout=10s backup;
        # server api-3:3000   max_fails=3 fail_timeout=10s backup;
    }

    # --- Real IP behind Cloudflare / ALB ---
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # HSTS assumes TLS terminates upstream (Cloudflare / ALB). Otherwise
        # move this server{} onto :443 and set your certificates.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        client_max_body_size 100m;

        # --- Health checks: bypass rate limit, don't log noise ---
        location = /api/healthz { proxy_pass http://cyberai_api; access_log off; }
        location = /api/readyz  { proxy_pass http://cyberai_api; access_log off; }

        # --- Static/media forwarding: CDN takes precedence if configured ---
        location /uploads/ {
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://cyberai_api;
        }

        # --- Auth path: tighter rate limit ---
        location ~ ^/api/(auth|login|signup) {
            limit_req zone=login_ip burst=10 nodelay;
            proxy_pass http://cyberai_api;
            include /etc/nginx/proxy_common.conf;
        }

        # --- Default API path ---
        location /api/ {
            limit_req zone=api_ip burst=100 nodelay;
            limit_conn conn_ip 100;
            proxy_pass http://cyberai_api;
            include /etc/nginx/proxy_common.conf;
        }

        # --- Frontend / SSR ---
        location / {
            proxy_pass http://cyberai_api;
            include /etc/nginx/proxy_common.conf;
        }
    }
}
