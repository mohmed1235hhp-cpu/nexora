# Production-shaped Compose stack:
#   - nginx load balancer in front of horizontally-scaled `api`
#   - dedicated `worker` service for background jobs
#   - postgres + redis with persistence + healthchecks
# `docker compose -f docker-compose.prod.yml up --scale api=3 --scale worker=2 -d`
version: "3.9"

x-common-env: &common-env
  NODE_ENV: production
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://cyberai:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production, e.g. openssl rand -base64 32}@postgres:5432/cyberai
  REDIS_URL: redis://redis:6379
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.cyberai.example}
  COOKIE_SECURE: "true"
  QUEUE_DRIVER: bullmq
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  CDN_BASE_URL: ${CDN_BASE_URL:-}
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
  SLOW_QUERY_MS: "500"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberai
      POSTGRES_USER: cyberai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production, e.g. openssl rand -base64 32}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberai -d cyberai"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment: *common-env
    # No ports: nginx fronts these. Scale with `--scale api=N`.
    expose: ["3000"]
    deploy:
      replicas: 3
      restart_policy: { condition: on-failure, delay: 5s, max_attempts: 5 }
      resources:
        limits: { cpus: "2", memory: 2G }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      <<: *common-env
      WORKER_ROLE: "all"
    command: ["node", "--enable-source-maps", "artifacts/api-server/dist/worker.mjs"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "4", memory: 4G }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
